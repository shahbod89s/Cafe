{% load static %}


<!DOCTYPE html>
<html lang="fa" dir="rtl">


<head>


    <meta charset="UTF-8">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <link rel="stylesheet" href="{% static 'css/style.css' %}">



    <style>
        .completed-container {


            width: 90%;

            max-width: 1200px;

            margin: 40px auto;


        }




        .completed-box {


            background: #fff8e8;

            padding: 25px;

            border-radius: 18px;

            box-shadow:

                0 15px 35px rgba(0, 0, 0, .12);


        }



        .completed-box h2 {


            color: #5a4318;

            margin-bottom: 25px;


        }




        .completed-row {


            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;


            background: white;


            padding: 16px 20px;


            margin-bottom: 12px;


            border-radius: 12px;


            border-right: 7px solid #27ae60;


        }





        .completed-row span {


            font-weight: 700;

            color: #3d2b13;


        }




        .status-done {


            color: #27ae60 !important;

        }





        .hero-btn {


            font-family: "Vazirmatn", sans-serif !important;

            font-weight: 700;

            border-radius: 12px;


        }





        .empty-text {


            text-align: center;

            opacity: .7;


        }




        body.dark-mode .completed-box {


            background: #171512;


        }





        body.dark-mode .completed-row {


            background: #111;


        }





        body.dark-mode .completed-row span {


            color: #c9a84c;


        }





        body.dark-mode .completed-box h2 {


            color: #c69b3c;


        }
    </style>



</head>




<body>




    <section class="menu-header dashboard-header">



        <h1>

            سفارش‌های تحویل شده

        </h1>




        <a href="{% url 'dashboard' %}" class="hero-btn">

            بازگشت به داشبورد

        </a>



    </section>








    <div class="completed-container">





        <div class="completed-box">





            <h2>

                🟢 سفارش‌های انجام شده

            </h2>







            {% for order in orders %}




            <div class="completed-row">





                <span>

                    #{{order.id}}

                </span>





                <span>

                    {{order.food.name}}

                </span>





                <span>

                    {{order.customer_name}}

                </span>





                <span>

                    {{order.created_at|date:"Y/m/d H:i"}}

                </span>





                <span class="status-done">

                    تحویل داده شد 🟢

                </span>






            </div>






            {% empty %}



            <p class="empty-text">

                هنوز سفارشی تحویل داده نشده است

            </p>



            {% endfor %}





        </div>





    </div>






</body>


</html>
